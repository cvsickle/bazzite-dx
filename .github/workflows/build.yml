name: bluebuild
on:
  schedule:
    - cron: "17 2 * * THU" # Thursday 2:17 AM ET
      timezone: "America/New_York"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".devcontainer/**"
      - ".github/**"
      - "docs/**"
  workflow_dispatch: # allow manually triggering builds

concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    env:
      BB_BUILD_DRIVER: podman
      BB_RUN_DRIVER: podman
      BB_INSPECTOR_DRIVER: skopeo
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          - recipe-nvidia.yml
          - recipe-base.yml
    steps:
      # chunkah writes an uncompressed OCI directory next to the rootfs and the
      # image, which exhausted disk quota on the runner. Reclaim what we can first
      # and log usage so the next failure shows where the space went.
      - name: Free extra disk space for chunkah
        run: |
          echo "Disk usage before cleanup:"
          df -h /
          sudo docker image prune --all --force || true
          sudo docker builder prune --all --force || true
          sudo rm -rf /opt/hostedtoolcache || true
          echo "Disk usage after cleanup:"
          df -h /

      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ""
          maximize_build_space: true
          chunkah: true
