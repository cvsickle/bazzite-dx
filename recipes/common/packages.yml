---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  # Fedora packages
  - type: dnf
    install:
      packages:
        # Terminal utilities
        - neovim
        - tree-sitter-cli
        - ripgrep
        - fd-find
        - zstd
        # GTK Theming
        - kde-gtk-config
        - xdg-desktop-portal-gtk
        # Applications
        - arm-image-installer
    replace:
      - from-repo: fedora
        packages:
          - old: tuned-ppd
            new: power-profiles-daemon

  # Starship
  - type: dnf
    repos:
      copr:
        - atim/starship
      cleanup: true
    install:
      packages:
        - starship

  # Lazygit
  - type: dnf
    repos:
      copr:
        - dejan/lazygit
      cleanup: true
    install:
      packages:
        - lazygit

  # Helium browser
  - type: dnf
    repos:
      copr:
        - imput/helium
      cleanup: true
    install:
      packages:
        - helium-bin
