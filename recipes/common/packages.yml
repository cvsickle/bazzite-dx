---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  # Fedora packages
  - type: dnf
    install:
      packages:
        # Terminal utilities
        - neovim
        - tree-sitter-cli
        - ripgrep
        - fd-find
        - btop
    replace:
      - from-repo: fedora
        packages:
          - old: tuned-ppd
            new: power-profiles-daemon

  # Lazygit
  - type: dnf
    repos:
      copr:
        - dejan/lazygit
      cleanup: true
    install:
      packages:
        - lazygit

  # Helium browser
  - type: dnf
    repos:
      copr:
        - imput/helium
      cleanup: true
    install:
      packages:
        - helium-bin
