---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  # Fedora packages
  - type: dnf
    install:
      packages:
        # Terminal utilities
        - gh
        - neovim
        - tree-sitter-cli
        - ripgrep
        - fd-find
        - iperf3
        # GTK Theming
        - adw-gtk3-theme
        - breeze-gtk
        # plasma-theme-master build dependencies
        - gcc-c++
        - cmake
        - extra-cmake-modules
        - qt6-qtbase-devel
        - kf6-kconfig-devel
        - kf6-kcoreaddons-devel
        - kf6-kcolorscheme-devel
        - pipx
        # Applications
        - arm-image-installer
    replace:
      - from-repo: fedora
        packages:
          - old: tuned-ppd
            new: power-profiles-daemon

  # Starship
  - type: dnf
    repos:
      copr:
        - atim/starship
      cleanup: true
    install:
      packages:
        - starship

  # Lazygit
  - type: dnf
    repos:
      copr:
        - dejan/lazygit
      cleanup: true
    install:
      packages:
        - lazygit

  # Helium browser
  - type: dnf
    repos:
      copr:
        - imput/helium
      cleanup: true
    install:
      packages:
        - helium-bin

  # Bibata Cursor Theme
  - type: dnf
    repos:
      copr:
        - peterwu/rendezvous
      cleanup: true
    install:
      packages:
        - bibata-cursor-themes
